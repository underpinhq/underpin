# Versions and publishes the packages of this repository.
#
# `version` opens or updates the "Version Packages" pull request while changesets are pending.
# Merging it bumps the versions on main. `@underpin/ui` is versioned in Highseat instead (the
# changesets config ignores it), and its bump arrives here through the sync.
#
# `release` publishes every package version listed in underpin.release.json that is not on npm
# yet, with provenance, and creates its GitHub Release. Every push to main runs it: a merged
# "Version Packages" pull request here, or a sync from Highseat that carries a UI bump. A push
# that changes no version publishes nothing.
#
# The reusable workflows and the `underpin` CLI come from `packages/config` in this repository,
# so a release runs the workflow files and the CLI build of the commit being released.
#
# npm trusts this file by name (trusted publishing, no NPM_TOKEN): renaming it breaks
# publishing until each package's trusted publisher on npmjs.com names the new file.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # A manual run can target any branch, so only main may version or publish.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/public-version.yml
    with:
      # The lockfile records each workspace's version, so the bump rewrites it too.
      version-command: bun run version-packages

  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/public-release.yml
    with:
      # CI does not run on the "Version Packages" pull request, so check again before publishing.
      build-command: bun run check-types && bun run test && bun run build
